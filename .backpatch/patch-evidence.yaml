schema: osera-patch-evidence/0.1.0
producer: moderne
release: 4.2.1-backpatch-00002
baseline: v4.2.0+backpatch.baseline
fixes:
  - cve: CVE-2026-59869
    upstream_fix_url: https://github.com/nodeca/js-yaml/commit/59423c6f8cdc78742ac00e25a4dd39ef16b702e4
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-59869
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-js-yaml/compare/6eb27ac~1...525c01f
    basis: backport
    artifacts:
      - js-yaml
    note: "Carried from 4.2.1-backpatch-00001; upstream's fix in 4.3.0 without its changelog entry, and with its README text placed by hand. As upstream does, this replaces the loader option maxMergeSeqLength with maxTotalMergeKeys (default 10000, -1 disables) and drops 4.2.0's dedupe of repeated merge sources. A maxMergeSeqLength a caller passes is now ignored. With CVE-2026-84375's fix in the same release, the budget charges each merge source as well as each key, again for each repeat of an alias, and one budget is shared across all documents of a loadAll, so a document can throw YAMLException where 4.2.0 loaded it with fewer than 10000 keys merged: 101 mappings merging a 99-key default do. The dedupe and limit this drops came in 4.2.0, the advisory's fixed version for CVE-2026-53550, repeated aliases on merge; such a sequence now throws once it passes the sequence cap or the budget, as the input of 4.2.0's dedupe test does, and 4.2.0's two tests of the dedupe and limit go, as upstream does."
  - cve: CVE-2026-84375
    upstream_fix_url: https://github.com/nodeca/js-yaml/commit/d90b6612a5a84385bdcb556c44578eac76dc0f6b
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-84375
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-js-yaml/compare/6eb27ac~1...525c01f
    basis: backport
    artifacts:
      - js-yaml
    note: "Carried from 4.2.1-backpatch-00001; upstream's fix in 4.3.2. As shipped, 4.2.0's limit of 20 rejects this CVE's input; the fix for CVE-2026-59869 removes that limit and reopens the input, which loaded in about 2.7 s with that fix alone, so both ship in one release and this CVE's input stays rejected. The advisory's range includes 4.2.0. A merge sequence over 100 now throws YAMLException, whatever maxTotalMergeKeys says; sequences of 21 to 100, which 4.2.0 rejected, now load within the maxTotalMergeKeys budget."
  - cve: CVE-2026-59870
    upstream_fix_url: https://github.com/nodeca/js-yaml/commit/c3cc4b0bb9ddb9af2dd9b61e0d56f5ce7983cd4a
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-59870
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-js-yaml/compare/ec464b0~1...549ffc3
    basis: backport
    artifacts:
      - js-yaml
    note: "New in this release; upstream's fix in 4.3.1, without its changelog entry. Loading an !!omap now tracks the keys it has seen as own properties of an object instead of scanning an array for each pair, so a large ordered map loads in linear time; a duplicate key is still rejected, as upstream does. Upstream's fix carries no test; ours was written for it."
tests:
  commit: 549ffc382974c8fd862b60568a3d109c9c485056
  command: npm ci --ignore-scripts, npm run build, then node --test --test-reporter=junit test/core/*.test.* test/build/*.test.*, with the junit reporter's hostname attribute removed from the report
  runtime: Node.js v22.16.0, npm 11.4.2, macOS 27.2 arm64
  report: js-yaml-4.2.1-backpatch-00002-tests.zip
  report_sha256: 12a34cdf5d5a8f86403ed6fd5034a4191b83c5ee01868d4e1d5d473e7c8af68e
  result: pass
  note: "upstream's core and build suites at the tested commit, plus our test for CVE-2026-59870 and our two for CVE-2026-84375: 314 tests, 313 passed, 0 failed, and upstream's own skipped test, Recursive custom objects, which 4.2.0 skips too. Our test for CVE-2026-59870 loads a 100000-pair omap within 2000 ms and checks that a duplicate key is still rejected; with the fix's production lines reverted at the tested commit it fails, taking 5772 ms. Built with vite at the tested commit in a directory named js-yaml, 26 of npmjs's 36 files for 4.2.0 are identical; the rest are this fix in lib/type/omap.js, 4.2.1-backpatch-00001's fixes in lib/loader.js and README.md, the six dist files built from both, and the version. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build."
